{% load humanize %}
<h2>Create Return</h2>

<form method="post">
    {% csrf_token %}

    <label>Reason:</label>
    <textarea name="reason"></textarea>

    <h3>Items</h3>

    {% for item in receipt.items.all %}
        <div>
            {{ item.product.name }} (Received: {{ item.quantity_received }})
            <input type="number" name="qty_{{ item.id }}" min="0">
        </div>
    {% endfor %}

    <button type="submit">Submit Return</button>
</form>
