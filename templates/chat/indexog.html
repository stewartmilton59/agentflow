<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmaflow's AI Assistant — Beta</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {
            --bg-deep: #0a0f1a;
            --bg-surface: #111827;
            --bg-card: rgba(17, 24, 39, 0.7);
            --border: rgba(56, 239, 186, 0.12);
            --accent: #38efba;
            --accent-dim: rgba(56, 239, 186, 0.15);
            --accent-glow: rgba(56, 239, 186, 0.3);
            --fg: #e8ecf1;
            --fg-muted: #7a8ba5;
            --user-bubble: linear-gradient(135deg, #38efba 0%, #0ccea6 100%);
            --ai-bubble: rgba(30, 41, 59, 0.85);
            --danger: #f87171;
            --shadow-accent: 0 0 40px rgba(56, 239, 186, 0.08);
            --list-accent: rgba(56, 239, 186, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-deep);
            color: var(--fg);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .bg-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(56,239,186,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56,239,186,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridShift 20s linear infinite;
        }
        @keyframes gridShift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        .bg-orb {
            position: fixed; border-radius: 50%; filter: blur(100px);
            pointer-events: none; z-index: 0;
        }
        .bg-orb--1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(56,239,186,0.12), transparent 70%);
            top: -150px; right: -100px;
            animation: orbFloat1 18s ease-in-out infinite;
        }
        .bg-orb--2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(14,165,130,0.10), transparent 70%);
            bottom: -100px; left: -80px;
            animation: orbFloat2 22s ease-in-out infinite;
        }
        .bg-orb--3 {
            width: 250px; height: 250px;
            background: radial-gradient(circle, rgba(56,239,186,0.06), transparent 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            animation: orbFloat3 15s ease-in-out infinite;
        }
        @keyframes orbFloat1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-60px, 40px) scale(1.15); }
        }
        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, -30px) scale(1.1); }
        }
        @keyframes orbFloat3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
        }

        .particles {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute; width: 2px; height: 2px;
            background: var(--accent); border-radius: 50%;
            opacity: 0; animation: particleDrift linear infinite;
        }
        @keyframes particleDrift {
            0% { opacity: 0; transform: translateY(100vh) scale(0); }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1); }
        }

        .app-wrapper {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            height: 100vh; max-width: 780px;
            margin: 0 auto; padding: 0 16px;
        }

        /* ── Header ── */
        .chat-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 0 16px; flex-shrink: 0;
        }
        .chat-header__left {
            display: flex; align-items: center; gap: 14px;
        }
        .chat-avatar {
            width: 46px; height: 46px; border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), #0ccea6);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: var(--bg-deep); font-weight: 700;
            box-shadow: 0 0 20px var(--accent-glow);
            animation: avatarPulse 3s ease-in-out infinite;
        }
        @keyframes avatarPulse {
            0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
            50% { box-shadow: 0 0 35px var(--accent-glow), 0 0 60px rgba(56,239,186,0.1); }
        }
        .chat-header__title {
            font-size: 1.2rem; font-weight: 600; letter-spacing: -0.3px;
        }
        .chat-header__subtitle {
            font-size: 0.78rem; color: var(--fg-muted); margin-top: 1px;
            display: flex; align-items: center; gap: 6px;
        }
        .status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--accent); display: inline-block;
            animation: statusBlink 2s ease-in-out infinite;
        }
        @keyframes statusBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .beta-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem; font-weight: 500;
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 4px 10px; border-radius: 20px;
            letter-spacing: 1.5px; text-transform: uppercase;
            animation: badgeGlow 4s ease-in-out infinite;
        }
        @keyframes badgeGlow {
            0%, 100% { border-color: var(--border); }
            50% { border-color: var(--accent-glow); }
        }
        .header-actions { display: flex; gap: 8px; }
        .header-btn {
            width: 38px; height: 38px; border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--fg-muted); font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.25s ease;
            backdrop-filter: blur(10px);
        }
        .header-btn:hover {
            color: var(--accent); border-color: var(--accent-glow);
            background: var(--accent-dim);
            transform: translateY(-1px);
        }

        .header-divider {
            height: 1px; flex-shrink: 0;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin-bottom: 12px;
        }

        /* ── Chat area ── */
        #chat-box {
            flex: 1; overflow-y: auto; padding: 8px 4px 16px;
            display: flex; flex-direction: column; gap: 6px;
            scroll-behavior: smooth;
            mask-image: linear-gradient(to bottom, transparent 0%, black 3%, black 97%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 3%, black 97%, transparent 100%);
        }
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-track { background: transparent; }
        #chat-box::-webkit-scrollbar-thumb {
            background: var(--accent-dim); border-radius: 10px;
        }

        .msg-row {
            display: flex; align-items: flex-end; gap: 10px;
            animation: msgSlideIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
        }
        .msg-row--user { flex-direction: row-reverse; }
        @keyframes msgSlideIn {
            0% { opacity: 0; transform: translateY(16px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .msg-avatar-sm {
            width: 30px; height: 30px; border-radius: 10px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 600;
        }
        .msg-avatar-sm--ai {
            background: var(--accent-dim); color: var(--accent);
            border: 1px solid var(--border);
        }
        .msg-avatar-sm--user {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: var(--fg-muted); border: 1px solid rgba(255,255,255,0.06);
        }

        .msg-content { max-width: 78%; }

        .msg {
            padding: 12px 16px; border-radius: 16px;
            font-size: 0.9rem; line-height: 1.7;
            word-wrap: break-word; position: relative;
        }
        .msg--ai {
            background: var(--ai-bubble);
            border: 1px solid var(--border);
            color: var(--fg);
            border-bottom-left-radius: 4px;
            backdrop-filter: blur(12px);
        }
        .msg--user {
            background: var(--user-bubble);
            color: var(--bg-deep);
            font-weight: 500;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 20px rgba(56, 239, 186, 0.15);
        }
        .msg--error {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.2);
            color: var(--danger);
            border-bottom-left-radius: 4px;
        }

        .msg-time {
            font-size: 0.65rem; color: var(--fg-muted);
            margin-top: 4px; padding: 0 4px;
            font-family: 'JetBrains Mono', monospace;
        }
        .msg-row--user .msg-time { text-align: right; }

        /* ══════════════════════════════════════════
           STYLES ZA MARKDOWN NDANI YA AI BUBBLE
           ══════════════════════════════════════════ */

        /* Bold */
        .msg--ai strong {
            color: var(--accent);
            font-weight: 600;
        }

        /* Italic */
        .msg--ai em {
            color: #a5c4d8;
            font-style: italic;
        }

        /* Inline code */
        .msg--ai code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            background: rgba(56, 239, 186, 0.08);
            border: 1px solid var(--border);
            padding: 1px 6px;
            border-radius: 5px;
            color: var(--accent);
        }

        /* Orodha yenye namba — ol */
        .msg--ai ol {
            margin: 8px 0 6px 0;
            padding-left: 0;
            list-style: none;
            counter-reset: md-counter;
        }
        .msg--ai ol li {
            counter-increment: md-counter;
            position: relative;
            padding: 5px 0 5px 36px;
            border-left: 2px solid var(--border);
            margin-left: 12px;
            transition: border-color 0.2s ease;
        }
        .msg--ai ol li:hover {
            border-left-color: var(--accent-glow);
        }
        .msg--ai ol li::before {
            content: counter(md-counter);
            position: absolute;
            left: -13px; top: 4px;
            width: 24px; height: 24px;
            background: var(--accent-dim);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            font-weight: 600;
            display: flex; align-items: center; justify-content: center;
        }
        .msg--ai ol li:last-child {
            border-left-color: transparent;
        }

        /* Orodha bila namba — ul */
        .msg--ai ul {
            margin: 8px 0 6px 0;
            padding-left: 0;
            list-style: none;
        }
        .msg--ai ul li {
            position: relative;
            padding: 4px 0 4px 26px;
        }
        .msg--ai ul li::before {
            content: '';
            position: absolute;
            left: 6px; top: 12px;
            width: 6px; height: 6px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0.7;
            box-shadow: 0 0 6px var(--accent-glow);
        }

        /* Aya ya kwanza ya AI bubble (intro text kabla ya orodha) */
        .msg--ai > .md-intro {
            margin-bottom: 4px;
        }

        /* Paragraph breaks */
        .msg--ai .md-para {
            margin-bottom: 10px;
        }
        .msg--ai .md-para:last-child {
            margin-bottom: 0;
        }

        /* ── Typing indicator ── */
        .typing-indicator {
            display: none; align-items: flex-end; gap: 10px;
            animation: msgSlideIn 0.3s ease forwards;
        }
        .typing-indicator.visible { display: flex; }
        .typing-dots {
            background: var(--ai-bubble);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            padding: 14px 20px; border-radius: 16px;
            border-bottom-left-radius: 4px;
            display: flex; gap: 5px; align-items: center;
        }
        .typing-dots span {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--accent); opacity: 0.4;
            animation: dotBounce 1.4s ease-in-out infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes dotBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ── Welcome section ── */
        .welcome-section {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 40px 20px 20px;
            text-align: center;
        }
        .welcome-icon {
            width: 64px; height: 64px; border-radius: 20px;
            background: linear-gradient(135deg, var(--accent), #0ccea6);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: var(--bg-deep);
            margin-bottom: 18px;
            box-shadow: 0 0 40px var(--accent-glow);
        }
        .welcome-title {
            font-size: 1.3rem; font-weight: 600; margin-bottom: 6px;
        }
        .welcome-desc {
            font-size: 0.85rem; color: var(--fg-muted); max-width: 360px;
            line-height: 1.6; margin-bottom: 24px;
        }
        .quick-actions {
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
        }
        .quick-btn {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.78rem; padding: 8px 16px;
            border-radius: 20px; border: 1px solid var(--border);
            background: var(--bg-card); color: var(--fg-muted);
            cursor: pointer; transition: all 0.25s ease;
            backdrop-filter: blur(10px);
        }
        .quick-btn:hover {
            color: var(--accent); border-color: var(--accent-glow);
            background: var(--accent-dim);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(56,239,186,0.08);
        }

        /* ── Input area ── */
        .input-area { flex-shrink: 0; padding: 12px 0 20px; }
        .input-wrapper {
            display: flex; align-items: center; gap: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px; padding: 6px 6px 6px 18px;
            backdrop-filter: blur(16px);
            transition: all 0.3s ease;
        }
        .input-wrapper:focus-within {
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 3px var(--accent-dim), var(--shadow-accent);
        }
        #user-input {
            flex: 1; border: none; outline: none;
            background: transparent; color: var(--fg);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem; padding: 8px 0;
        }
        #user-input::placeholder { color: var(--fg-muted); opacity: 0.6; }

        .send-btn {
            width: 44px; height: 44px; border-radius: 12px;
            border: none; cursor: pointer;
            background: linear-gradient(135deg, var(--accent), #0ccea6);
            color: var(--bg-deep); font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.25s ease; flex-shrink: 0;
        }
        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(56, 239, 186, 0.3);
        }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled {
            opacity: 0.3; cursor: not-allowed;
            transform: none; box-shadow: none;
        }

        .input-hint {
            text-align: center; font-size: 0.68rem;
            color: var(--fg-muted); opacity: 0.5;
            margin-top: 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* ── Toast ── */
        .toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            display: flex; flex-direction: column; gap: 8px;
        }
        .toast {
            background: var(--bg-surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px 18px;
            color: var(--fg); font-size: 0.82rem;
            backdrop-filter: blur(12px);
            animation: toastIn 0.35s ease forwards;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .toast--error { border-color: rgba(248,113,113,0.3); }
        .toast--error i { color: var(--danger); }
        .toast--success { border-color: rgba(56,239,186,0.3); }
        .toast--success i { color: var(--accent); }
        .toast.hiding { animation: toastOut 0.3s ease forwards; }
        @keyframes toastIn {
            0% { opacity: 0; transform: translateX(40px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes toastOut {
            0% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(40px); }
        }

        /* ── Modal ── */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 50;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
            display: none; align-items: center; justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.visible { display: flex; }
        .modal-box {
            background: var(--bg-surface); border: 1px solid var(--border);
            border-radius: 20px; padding: 28px; max-width: 380px; width: 90%;
            text-align: center; animation: modalPop 0.3s cubic-bezier(0.22,1,0.36,1);
        }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .modal-box h4 { font-size: 1.05rem; margin-bottom: 8px; }
        .modal-box p { font-size: 0.82rem; color: var(--fg-muted); margin-bottom: 22px; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .modal-btn {
            font-family: 'Space Grotesk', sans-serif;
            padding: 10px 22px; border-radius: 12px; font-size: 0.85rem;
            cursor: pointer; transition: all 0.2s ease; border: none;
        }
        .modal-btn--cancel {
            background: var(--bg-card); color: var(--fg-muted);
            border: 1px solid var(--border);
        }
        .modal-btn--cancel:hover { color: var(--fg); border-color: rgba(255,255,255,0.15); }
        .modal-btn--confirm {
            background: rgba(248,113,113,0.15); color: var(--danger);
            border: 1px solid rgba(248,113,113,0.2);
        }
        .modal-btn--confirm:hover { background: rgba(248,113,113,0.25); }

        .msg-counter {
            position: fixed; bottom: 90px; left: 50%;
            transform: translateX(-50%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem; color: var(--fg-muted);
            opacity: 0.3; z-index: 2; pointer-events: none;
        }

        @media (max-width: 600px) {
            .app-wrapper { padding: 0 10px; }
            .msg-content { max-width: 88%; }
            .welcome-section { padding: 24px 12px 12px; }
            .quick-actions { gap: 6px; }
            .quick-btn { font-size: 0.72rem; padding: 6px 12px; }
            .beta-badge { display: none; }
            .msg--ai ol li { padding-left: 30px; }
            .msg--ai ol li::before { width: 20px; height: 20px; font-size: 0.6rem; left: -11px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>
    <div class="particles" id="particles"></div>

    <div class="toast-container" id="toast-container"></div>

    <div class="modal-overlay" id="clear-modal">
        <div class="modal-box">
            <h4>Futa Maongeo</h4>
            <p>Una uhakika unataka kufuta maongeo yote? Hatua hii haiwezi kurudishwa.</p>
            <div class="modal-actions">
                <button class="modal-btn modal-btn--cancel" id="modal-cancel">Ghairi</button>
                <button class="modal-btn modal-btn--confirm" id="modal-confirm">Futa</button>
            </div>
        </div>
    </div>

    <div class="app-wrapper">

        <header class="chat-header">
            <div class="chat-header__left">
                <div class="chat-avatar" aria-label="AI Avatar">S</div>
                <div>
                    <div class="chat-header__title">Pharmaflow AI</div>
                    <div class="chat-header__subtitle">
                        <span class="status-dot"></span>
                        Stewart — Mtandaoni
                    </div>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
                <span class="beta-badge">Beta</span>
                <div class="header-actions">
                    <button class="header-btn" id="clear-btn" title="Futa maongeo" aria-label="Futa maongeo">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>
        </header>
        <div class="header-divider"></div>

        <main id="chat-box" role="log" aria-label="Eneo la maongeo">

            <div class="welcome-section" id="welcome-section">
                <div class="welcome-icon">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div class="welcome-title">Karibu, Pharmaflow</div>
                <div class="welcome-desc">
                    Mimi ni msaidizi wako wa AI. Niambie unahitaji nini — nitajibu haraka na kwa usahihi.
                </div>
                <div class="quick-actions">
                    <button class="quick-btn" data-msg="Eleza mwenyewe kwa ufupi">Wapi uwezo wako?</button>
                    <button class="quick-btn" data-msg="Toa mawazo 5 ya biashara">Mawaza ya biashara</button>
                    <button class="quick-btn" data-msg="Andika shairi fupi kuhusu teknolojia">Andika shairi</button>
                    <button class="quick-btn" data-msg="Nifafanue machine learning kwa urahisi">Machine learning</button>
                </div>
            </div>

            <div class="typing-indicator" id="typing-indicator">
                <div class="msg-avatar-sm msg-avatar-sm--ai">S</div>
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </main>

        <div class="msg-counter" id="msg-counter"></div>

        <footer class="input-area">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Andika ujumbe wako..."
                       aria-label="Andika ujumbe" autocomplete="off">
                <button class="send-btn" id="send-btn" disabled aria-label="Tuma ujumbe">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
            <div class="input-hint">Bonyeza Enter kutuma &middot; Beta v0.1</div>
        </footer>
    </div>

    <script>
        /* ══════════════════════════════════════════════
           VIPENGELE MUHIMU
           ══════════════════════════════════════════════ */
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        const welcomeSection = document.getElementById('welcome-section');
        const clearBtn = document.getElementById('clear-btn');
        const clearModal = document.getElementById('clear-modal');
        const modalCancel = document.getElementById('modal-cancel');
        const modalConfirm = document.getElementById('modal-confirm');
        const msgCounter = document.getElementById('msg-counter');
        const toastContainer = document.getElementById('toast-container');

        let messageCount = 0;
        let isSending = false;

        /* ── Vipande vinavyoelea ── */
        (function createParticles() {
            const c = document.getElementById('particles');
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 14) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                const size = 1.5 + Math.random() * 2.5;
                p.style.width = p.style.height = size + 'px';
                c.appendChild(p);
            }
        })();

        function getTimeStr() {
            return new Date().toLocaleTimeString('sw-TZ', {
                hour: '2-digit', minute: '2-digit', hour12: false
            });
        }

        function scrollToBottom() {
            requestAnimationFrame(() => { chatBox.scrollTop = chatBox.scrollHeight; });
        }

        function showTyping() { typingIndicator.classList.add('visible'); scrollToBottom(); }
        function hideTyping() { typingIndicator.classList.remove('visible'); }

        function updateCounter() {
            msgCounter.textContent = messageCount > 0 ? messageCount + ' meseji' : '';
        }

        /* ══════════════════════════════════════════════
           MSOMOJI WA MARKDOWN — Lightweight
           Hufanya kazi kwa ajili ya jibu la AI tu.
           ══════════════════════════════════════════════ */
        function renderMarkdown(raw) {
            // 1. Escap HTML kwanza kuzuia XSS
            let text = raw
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            // 2. Gawanya kwa mistari
            const lines = text.split('\n');
            let html = '';
            let i = 0;

            while (i < lines.length) {
                const line = lines[i];

                // ── Angalia orodha yenye namba: "1. **Title:** ..."
                const olMatch = line.match(/^(\d+)\.\s+(.*)/);
                if (olMatch) {
                    // Kalibu mistari inayofuata ya orodha
                    const items = [];
                    while (i < lines.length) {
                        const m = lines[i].match(/^(\d+)\.\s+(.*)/);
                        if (m) {
                            // Ndosha bold na italic ndani ya kila item
                            items.push(inlineFormat(m[2]));
                            i++;
                        } else {
                            break;
                        }
                    }
                    html += '<ol>' + items.map(item => '<li>' + item + '</li>').join('') + '</ol>';
                    continue;
                }

                // ── Angalia orodha bila namba: "- item" au "* item"
                const ulMatch = line.match(/^[-*]\s+(.*)/);
                if (ulMatch) {
                    const items = [];
                    while (i < lines.length) {
                        const m = lines[i].match(/^[-*]\s+(.*)/);
                        if (m) {
                            items.push(inlineFormat(m[1]));
                            i++;
                        } else {
                            break;
                        }
                    }
                    html += '<ul>' + items.map(item => '<li>' + item + '</li>').join('') + '</ul>';
                    continue;
                }

                // ── Mistari ya kawaida (paragraph)
                const trimmed = line.trim();
                if (trimmed === '') {
                    // Mstari wazi — acha nafasi
                    i++;
                    continue;
                }

                html += '<p class="md-para">' + inlineFormat(trimmed) + '</p>';
                i++;
            }

            return html;
        }

        /* ── Ndosha bold, italic, na inline code ── */
        function inlineFormat(text) {
            // Inline code: `code`
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            // Bold: **text**
            text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            // Italic: *text* (siyo pamoja na bold)
            text = text.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');
            return text;
        }

        /* ══════════════════════════════════════════════
           ONGEZA UJUMBE
           ══════════════════════════════════════════════ */
        function addMessage(text, type) {
            // Ficha sehemu ya karibu
            if (welcomeSection && messageCount === 0) {
                welcomeSection.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                welcomeSection.style.opacity = '0';
                welcomeSection.style.transform = 'translateY(-10px)';
                setTimeout(() => { if (welcomeSection.parentNode) welcomeSection.remove(); }, 300);
            }

            messageCount++;
            updateCounter();

            const row = document.createElement('div');
            row.className = 'msg-row' + (type === 'user' ? ' msg-row--user' : '');

            const avatarHTML = type === 'user'
                ? '<div class="msg-avatar-sm msg-avatar-sm--user"><i class="fa-solid fa-user" style="font-size:11px"></i></div>'
                : '<div class="msg-avatar-sm msg-avatar-sm--ai">S</div>';

            let msgClass = 'msg';
            if (type === 'user') msgClass += ' msg--user';
            else if (type === 'error') msgClass += ' msg--error';
            else msgClass += ' msg--ai';

            // Tumia markdown kwa AI, escape tu kwa user na error
            let contentHTML;
            if (type === 'ai') {
                contentHTML = renderMarkdown(text);
            } else {
                const div = document.createElement('div');
                div.textContent = text;
                contentHTML = div.innerHTML;
            }

            row.innerHTML = `
                ${avatarHTML}
                <div class="msg-content">
                    <div class="${msgClass}">${contentHTML}</div>
                    <div class="msg-time">${getTimeStr()}</div>
                </div>
            `;

            chatBox.insertBefore(row, typingIndicator);
            scrollToBottom();
        }

        /* ── Toast ── */
        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = 'toast toast--' + type;
            const icon = type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';
            toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${message}</span>`;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        /* ── Input logic ── */
        userInput.addEventListener('input', () => {
            sendBtn.disabled = userInput.value.trim() === '' || isSending;
        });

        function sendMessage() {
            const message = userInput.value.trim();
            if (!message || isSending) return;

            isSending = true;
            sendBtn.disabled = true;

            addMessage(message, 'user');
            userInput.value = '';
            showTyping();

            $.post('', {
                'message': message,
                'csrfmiddlewaretoken': '{{ csrf_token }}'
            }).done(function(data) {
                hideTyping();
                if (data.reply) {
                    addMessage(data.reply, 'ai');
                } else {
                    const errMsg = data.error || 'Hitilafu isiyojulikana';
                    addMessage(errMsg, 'error');
                    showToast('Hitilafu: ' + errMsg, 'error');
                }
            }).fail(function() {
                hideTyping();
                const errMsg = 'Haikuweza kuunganisha na seva';
                addMessage(errMsg, 'error');
                showToast(errMsg, 'error');
            }).always(function() {
                isSending = false;
                sendBtn.disabled = userInput.value.trim() === '';
                userInput.focus();
            });
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        /* ── Vitufe vya haraka ── */
        document.querySelectorAll('.quick-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                userInput.value = this.dataset.msg;
                sendBtn.disabled = false;
                sendMessage();
            });
        });

        /* ── Futa maongeo ── */
        clearBtn.addEventListener('click', () => {
            if (messageCount === 0) return;
            clearModal.classList.add('visible');
        });
        modalCancel.addEventListener('click', () => clearModal.classList.remove('visible'));
        clearModal.addEventListener('click', (e) => {
            if (e.target === clearModal) clearModal.classList.remove('visible');
        });
        modalConfirm.addEventListener('click', () => {
            clearModal.classList.remove('visible');
            chatBox.querySelectorAll('.msg-row').forEach(m => {
                m.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
                m.style.opacity = '0';
                m.style.transform = 'scale(0.95)';
                setTimeout(() => m.remove(), 250);
            });
            messageCount = 0;
            updateCounter();
            showToast('Maongeo yamefutwa', 'success');
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && clearModal.classList.contains('visible')) {
                clearModal.classList.remove('visible');
            }
        });

        userInput.focus();
    </script>
</body>
</html>
